name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: brew install jq shellcheck
      - name: Run ShellCheck
        run: shellcheck -x -e SC1090,SC1091,SC2016 install.sh config.example.sh scripts/*.sh swiftbar/*.sh tests/smoke.sh
      - name: Run smoke tests
        run: bash tests/smoke.sh
